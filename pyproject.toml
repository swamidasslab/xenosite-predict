[project]
name = "xenosite-predict"
version = "0.3.1"
description = "RDKit public API + internal OpenBabel 2.4 + ONNX predictors for XenoSite (xenosite.predict)"
readme = "README.md"
authors = [
    { name = "S. Joshua Swamidass", email = "swamidass@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "rdkit>=2023.9.2",
    "numpy>=1.26",
    "onnxruntime>=1.16",
    "httpx>=0.24",
    "pydantic>=2.5",
    "openbabel>=3.2.1",
    "xenosite-forest>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Local/editable installs still build a wheel. Published artifacts are sdist-only.
packages = ["src/xenosite"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/tools",
    "/weights",
    "/tests",
    "/docs",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.5",
    "pytest-sugar>=1",
    "msgpack>=1.0",
    "hypothesis>=6.100",
    "tqdm>=4.66",
    "pytest-cov>=7.1.0",
]
convert = [
    "safetensors>=0.4",
    "onnx>=1.15",
]

[tool.pytest.ini_options]
addopts = "-m \"not live and not full\" -n auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
markers = [
    "live: requires Docker legacy test API and/or ONNX weights",
    "full: exhaustive corpus parametrization (CI/nightly; use pytest -m full)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["xenosite.predict", "tests.v0_legacy.sampling"]
parallel = true
concurrency = ["multiprocessing"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true
