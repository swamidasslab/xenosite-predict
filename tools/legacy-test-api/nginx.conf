# Parallelism + response cache live here (not in the Python server).
proxy_cache_path /var/cache/nginx/predict levels=1:2 keys_zone=predict:100m max_size=2g inactive=24h use_temp_path=off;
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8099;
    client_max_body_size 4m;

    location /health {
        set $backend legacy-test-api;
        proxy_cache off;
        proxy_pass http://$backend:8099;
    }

    location / {
        set $backend legacy-test-api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache predict;
        proxy_cache_methods GET HEAD POST;
        proxy_cache_key "$uri|$request_body";
        proxy_cache_valid 200 24h;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://$backend:8099;
    }
}
