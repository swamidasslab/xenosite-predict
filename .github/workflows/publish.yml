# Publish to PyPI via Trusted Publishing (OIDC). No API tokens in GitHub secrets.
#
# One-time setup (package not on PyPI yet → pending publisher):
#   1. https://pypi.org/manage/account/publishing/
#   2. Add pending publisher:
#        PyPI project name: xenosite-predict
#        Owner:             swamidasslab
#        Repository:        xenosite-predict
#        Workflow name:     publish.yml
#        Environment:       pypi
#   3. GitHub → Settings → Environments → create `pypi`
#      (optional but recommended: required reviewers)
#   4. Tag vX.Y.Z and push (see docs/release.md). Do not compile CHANGELOG locally.
#      Package version comes from the git tag (hatch-vcs), not pyproject.toml.
#      Checkout uses fetch-depth: 0 so hatch-vcs can see tags.
#      uv build runs on the tagged commit (dist version matches the tag).
#      Then towncrier compiles changelog.d/ into CHANGELOG.md as a new commit
#      on the default branch (not an amend; the tag is not moved).
#      GitHub Release uses that section.
#
# Docs: https://docs.pypi.org/trusted-publishers/

name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # changelog commit on tags
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Version without v prefix
        if: startsWith(github.ref, 'refs/tags/v')
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Compile CHANGELOG.md from towncrier fragments
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.ver.outputs.version }}"
          if grep -Eq "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md already has [${VERSION}]"
          else
            uvx towncrier build --yes --version "$VERSION"
          fi
          git add CHANGELOG.md changelog.d
          if git diff --cached --quiet; then
            echo "No changelog changes to commit"
            exit 0
          fi
          git commit -m "Update CHANGELOG.md for ${GITHUB_REF_NAME}."
          if ! git push origin "HEAD:refs/heads/${{ github.event.repository.default_branch }}"; then
            echo "::warning::Could not fast-forward ${{ github.event.repository.default_branch }} with CHANGELOG.md. GitHub Release notes are still created."
          fi
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: changelog
          path: CHANGELOG.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xenosite-predict
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Version without v prefix
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .
      - name: Read changelog
        id: changelog
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ steps.ver.outputs.version }}
          path: ./CHANGELOG.md
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changes }}
